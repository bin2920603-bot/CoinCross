name: line-score

on:
  workflow_dispatch:
    inputs:
      days:
        description: "며칠치를 볼지 (숫자)"
        default: "30"

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 이평선 승률표 만들기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCORE_DAYS: ${{ inputs.days || '30' }}
        run: python line_score.py
