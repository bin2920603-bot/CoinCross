name: all-daily

on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "테스트(1장만)"
        type: boolean
        default: false

concurrency:
  group: all-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: all_daily_state.json
          key: all-daily-${{ github.run_id }}
          restore-keys: all-daily-
      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALL_CHAT: ${{ secrets.ALL_CHAT }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python all_daily.py --test; else python all_daily.py; fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: all_daily_state.json
          key: all-daily-${{ github.run_id }}
