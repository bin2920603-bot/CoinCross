name: linetouch-alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      find:
        description: "방 찾기 (처음 한 번만 체크)"
        type: boolean
        default: false
      test:
        description: "테스트 알림 보내기"
        type: boolean
        default: false

concurrency:
  group: linetouch
  cancel-in-progress: false

jobs:
  linetouch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 지난 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: line_touch_state.json
          key: linetouch-state-${{ github.run_id }}
          restore-keys: linetouch-state-

      - name: 선 터치 찾기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          LINETOUCH_CHAT: ${{ secrets.LINETOUCH_CHAT }}
        run: |
          if [ "${{ inputs.find }}" = "true" ]; then
            python line_touch.py --find
          elif [ "${{ inputs.test }}" = "true" ]; then
            python line_touch.py --test
          else
            python line_touch.py
          fi

      - name: 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: line_touch_state.json
          key: linetouch-state-${{ github.run_id }}
