name: rise-alert

on:
  schedule:
    - cron: "3-58/5 * * * *"   # 5분마다
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림 보내기"
        type: boolean
        default: false

concurrency:
  group: rise
  cancel-in-progress: false

jobs:
  rise:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 지난 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: rise_state.json
          key: rise-state-${{ github.run_id }}
          restore-keys: rise-state-

      - name: 전일대비 찾기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RISE_CHAT: ${{ secrets.RISE_CHAT }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python rise.py --test
          else
            python rise.py --loop
          fi

      - name: 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rise_state.json
          key: rise-state-${{ github.run_id }}
