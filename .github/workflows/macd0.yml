name: macd0-alert

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      find:
        description: "방 찾기 (처음 한 번만 체크)"
        type: boolean
        default: false
      test:
        description: "테스트 알림 보내기"
        type: boolean
        default: false

concurrency:
  group: macd0
  cancel-in-progress: false

jobs:
  macd0:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 지난 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: macd0_state.json
          key: macd0-state-${{ github.run_id }}
          restore-keys: macd0-state-

      - name: MACD 0선 돌파 알림 (15분마다 반복, 약 5시간 40분)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MACD0_CHAT: ${{ secrets.MACD0_CHAT }}
        run: |
          if [ "${{ inputs.find }}" = "true" ]; then
            python macd0.py --find
          elif [ "${{ inputs.test }}" = "true" ]; then
            python macd0.py --test
          else
            python macd0.py
          fi

      - name: 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: macd0_state.json
          key: macd0-state-${{ github.run_id }}
